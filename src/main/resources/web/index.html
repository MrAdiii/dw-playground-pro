<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DataWeave Playground Pro</title>
<meta name="author" content="mradiii" />
<meta name="description" content="Self-hosted DataWeave 2.0 playground | Large payload support | Named variables | Mule 4 | Docker | Offline" />
<meta property="og:title" content="DataWeave Playground Pro" />
<meta property="og:description" content="Self-hosted DataWeave 2.0 playground with large payload support, named variables, and offline capability. Built on Mule 4 + Docker." />
<meta property="og:type" content="website" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='80' fill='%232dd4bf'>{ }</text></svg>" />

<!-- Bundled CodeMirror (no external CDN required) -->
<link rel="stylesheet" href="editor.css">

<style>
  :root[data-theme="dark"] {
    --bg: #090d13;
    --panel: #0e1520;
    --panel-header: #131c2a;
    --panel-sub: #0a1018;
    --border: #1e293b;
    --border-hover: #334155;
    --text: #e2e8f0;
    --text-muted: #94a3b8;
    --text-faint: #64748b;
    --accent: #2dd4bf;
    --accent-hover: #14b8a6;
    --accent-glow: rgba(45, 212, 191, 0.2);
    --accent-subtle: rgba(45, 212, 191, 0.1);
    --err: #f87171;
    --err-bg: rgba(248, 113, 113, 0.12);
    --ok: #34d399;
    --ok-glow: rgba(52, 211, 153, 0.25);
    --resizer-bg: #1e293b;
    --resizer-hover: #2dd4bf;
    --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.5);
    --btn-bg: #172234;
    --btn-hover: #1e2d44;
    --scrollbar-thumb: rgba(148, 163, 184, 0.22);
    --scrollbar-thumb-hover: #2dd4bf;
  }

  :root[data-theme="light"] {
    --bg: #f8fafc;
    --panel: #ffffff;
    --panel-header: #f1f5f9;
    --panel-sub: #f8fafc;
    --border: #e2e8f0;
    --border-hover: #cbd5e1;
    --text: #0f172a;
    --text-muted: #64748b;
    --text-faint: #94a3b8;
    --accent: #0d9488;
    --accent-hover: #0f766e;
    --accent-glow: rgba(13, 148, 136, 0.25);
    --accent-subtle: rgba(13, 148, 136, 0.1);
    --err: #ef4444;
    --err-bg: rgba(239, 68, 68, 0.08);
    --ok: #10b981;
    --ok-glow: rgba(16, 185, 129, 0.2);
    --resizer-bg: #e2e8f0;
    --resizer-hover: #0d9488;
    --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.08);
    --btn-bg: #f1f5f9;
    --btn-hover: #e2e8f0;
    --scrollbar-thumb: rgba(100, 116, 139, 0.28);
    --scrollbar-thumb-hover: #0d9488;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  /* Universal Custom Modern Scrollbars */
  * {
    scrollbar-width: thin;
    scrollbar-color: var(--scrollbar-thumb) transparent;
  }
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background: var(--scrollbar-thumb);
    border-radius: 999px;
    transition: background-color 0.15s ease;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: var(--scrollbar-thumb-hover);
  }
  ::-webkit-scrollbar-corner {
    background: transparent;
  }

  /* Prevent selection & cursor jitter when resizing */
  body.is-resizing-h {
    user-select: none !important;
    -webkit-user-select: none !important;
    cursor: col-resize !important;
  }
  body.is-resizing-v {
    user-select: none !important;
    -webkit-user-select: none !important;
    cursor: row-resize !important;
  }
  body.is-resizing-h iframe, body.is-resizing-h textarea, body.is-resizing-h .CodeMirror,
  body.is-resizing-v iframe, body.is-resizing-v textarea, body.is-resizing-v .CodeMirror {
    pointer-events: none !important;
  }

  /* --- Top Header --- */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 18px;
    background: var(--panel-header);
    border-bottom: 1px solid var(--border);
    flex: none;
    z-index: 20;
    height: 48px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    user-select: none;
  }
  .brand-logo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    flex-shrink: 0;
    border-radius: 7px;
    background: var(--accent-subtle);
    color: var(--accent);
    border: 1px solid var(--accent);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 14px;
    font-weight: 800;
    line-height: 1;
    white-space: nowrap;
  }
  .brand-text {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand-title {
    color: var(--text);
    font-size: 14.5px;
    font-weight: 700;
    letter-spacing: -0.01em;
    white-space: nowrap;
  }
  .brand-badge {
    font-size: 10px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-subtle);
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 1px 7px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
  }

  /* Status indicator pill */
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
    padding: 4px 11px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--panel);
    font-variant-numeric: tabular-nums;
    transition: all 0.2s ease;
    white-space: nowrap;
  }
  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-muted);
    transition: background-color 0.2s ease;
  }
  .pill.running {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--accent-subtle);
  }
  .pill.running .dot {
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    animation: pulse 1s ease-in-out infinite;
  }
  .pill.ok {
    color: var(--ok);
    border-color: rgba(52, 211, 153, 0.35);
  }
  .pill.ok .dot {
    background: var(--ok);
    box-shadow: 0 0 6px var(--ok-glow);
  }
  .pill.error {
    color: var(--err);
    border-color: rgba(248, 113, 113, 0.4);
    background: var(--err-bg);
  }
  .pill.error .dot {
    background: var(--err);
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.85); }
  }

  /* Action Buttons */
  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--btn-bg);
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.15s ease;
    padding: 0;
  }
  .icon-btn:hover {
    color: var(--text);
    border-color: var(--border-hover);
    background: var(--btn-hover);
  }
  .icon-btn svg { width: 15px; height: 15px; fill: currentColor; }

  .btn-sm {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px;
    font-size: 11.5px;
    font-weight: 500;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--btn-bg);
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.15s ease;
    font-family: inherit;
  }
  .btn-sm:hover {
    color: var(--text);
    border-color: var(--border-hover);
    background: var(--btn-hover);
  }
  .btn-sm.active {
    background: var(--accent);
    color: #042f2c;
    border-color: var(--accent);
    font-weight: 600;
  }
  .btn-sm svg { width: 13px; height: 13px; fill: currentColor; }

  /* --- Main 3-Pane Layout with Draggable Splitters --- */
  main {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: row;
    position: relative;
    overflow: hidden;
    background: var(--bg);
  }

  .pane {
    display: flex;
    flex-direction: column;
    min-width: 0;
    max-width: 100%;
    min-height: 0;
    background: var(--panel);
    overflow: hidden;
    position: relative;
  }

  /* Sub-panes inside Input Pane */
  .sub-pane {
    display: flex;
    flex-direction: column;
    min-width: 0;
    max-width: 100%;
    min-height: 60px;
    overflow: hidden;
    position: relative;
  }

  /* Sub-resizer between Payload & Vars */
  .resizer-sub {
    flex: 0 0 7px;
    height: 7px;
    width: 100%;
    background: var(--resizer-bg);
    cursor: row-resize;
    position: relative;
    user-select: none;
    -webkit-user-select: none;
    transition: background-color 0.2s ease;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .resizer-sub::after {
    content: "";
    position: absolute;
    inset: -4px 0;
    z-index: 1;
  }
  .resizer-grip-sub {
    width: 28px;
    height: 3px;
    border-radius: 2px;
    background: var(--text-faint);
    opacity: 0.35;
    transition: all 0.2s ease;
  }
  .resizer-sub.dragging {
    background: var(--resizer-hover);
  }
  .resizer-sub.dragging .resizer-grip-sub {
    opacity: 1;
    background: #ffffff;
    width: 44px;
  }

  /* Draggable Resizer Gutter - Main Layout */
  .resizer {
    flex: 0 0 7px;
    background: var(--resizer-bg);
    cursor: col-resize;
    position: relative;
    user-select: none;
    -webkit-user-select: none;
    transition: background-color 0.2s ease;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .resizer::after {
    content: "";
    position: absolute;
    inset: 0 -5px;
    z-index: 1;
  }
  .resizer-grip {
    width: 3px;
    height: 24px;
    border-radius: 2px;
    background: var(--text-faint);
    opacity: 0.35;
    transition: all 0.2s ease;
  }
  .resizer.dragging {
    background: var(--resizer-hover);
  }
  .resizer.dragging .resizer-grip {
    opacity: 1;
    background: #ffffff;
    height: 38px;
  }

  @media (hover: hover) {
    .resizer-sub:hover {
      background: var(--resizer-hover);
    }
    .resizer-sub:hover .resizer-grip-sub {
      opacity: 1;
      background: #ffffff;
      width: 44px;
    }
    .resizer:hover {
      background: var(--resizer-hover);
    }
    .resizer:hover .resizer-grip {
      opacity: 1;
      background: #ffffff;
      height: 38px;
    }
  }

  /* Header Error Badge */
  .badge-error {
    display: inline-flex;
    align-items: center;
    font-size: 10px;
    font-weight: 700;
    color: var(--err);
    background: var(--err-bg);
    border: 1px solid var(--err);
    border-radius: 4px;
    padding: 1px 6px;
    margin-left: 6px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-family: system-ui, -apple-system, sans-serif;
  }

  /* Pane Headers */
  .pane-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 12px;
    background: var(--panel-header);
    border-bottom: 1px solid var(--border);
    flex: none;
    height: 38px;
    min-width: 0;
    overflow: hidden;
  }
  .pane-head.divider {
    border-top: 1px solid var(--border);
  }
  .pane-head .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .pane-head .grow { flex: 1; min-width: 0; }

  /* Pane Bodies - Strictly prevent expansion */
  .pane-body {
    position: relative;
    flex: 1;
    min-height: 0;
    min-width: 0;
    max-width: 100%;
    overflow: hidden;
  }

  /* Dropdown Selects */
  select {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 11.5px;
    font-weight: 500;
    color: var(--text);
    background: var(--panel-sub);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 8px;
    cursor: pointer;
    outline: none;
    transition: border-color 0.15s ease;
  }
  select:focus { border-color: var(--accent); }

  /* Fallback plain textarea */
  textarea.ed {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    resize: none;
    border: 0;
    outline: none;
    background: transparent;
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 13px;
    line-height: 1.55;
    padding: 10px 12px;
    tab-size: 2;
    white-space: pre;
    overflow: auto;
    max-width: 100%;
    min-width: 0;
  }

  /* CodeMirror styling & long-string constraints */
  .CodeMirror {
    height: 100%;
    width: 100%;
    max-width: 100%;
    min-width: 0;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 13px;
    line-height: 1.55;
    background: transparent;
  }
  .CodeMirror-scroll {
    max-width: 100%;
    overflow-x: auto !important;
    overflow-y: auto !important;
  }
  .CodeMirror-gutters {
    background: var(--panel-header);
    border-right: 1px solid var(--border);
  }
  .CodeMirror-wrap pre.CodeMirror-line,
  .CodeMirror-wrap pre.CodeMirror-line-like {
    word-wrap: break-word;
    white-space: pre-wrap;
    word-break: normal;
    overflow-wrap: anywhere;
  }

  /* Modern Light Theme for CodeMirror */
  .cm-s-dw-light.CodeMirror {
    background: #ffffff;
    color: #1e293b;
  }
  .cm-s-dw-light .CodeMirror-gutters {
    background: #f8fafc;
    border-right: 1px solid #e2e8f0;
  }
  .cm-s-dw-light .CodeMirror-linenumber {
    color: #94a3b8;
  }
  .cm-s-dw-light .CodeMirror-cursor {
    border-left: 2px solid #0d9488;
  }
  .cm-s-dw-light div.CodeMirror-selected {
    background: #ccfbf1;
  }
  .cm-s-dw-light .cm-keyword {
    color: #7c3aed;
    font-weight: 600;
  }
  .cm-s-dw-light .cm-builtin {
    color: #0d9488;
    font-weight: 600;
  }
  .cm-s-dw-light .cm-string {
    color: #0284c7;
  }
  .cm-s-dw-light .cm-number {
    color: #ea580c;
  }
  .cm-s-dw-light .cm-comment {
    color: #64748b;
    font-style: italic;
  }
  .cm-s-dw-light .cm-def {
    color: #d97706;
    font-weight: 600;
  }
  .cm-s-dw-light .cm-meta {
    color: #4f46e5;
  }
  .cm-s-dw-light .cm-operator {
    color: #db2777;
  }
  .cm-s-dw-light .cm-variable {
    color: #1e293b;
  }
  .cm-s-dw-light .cm-variable-2 {
    color: #d97706;
    font-weight: 500;
  }
  .cm-s-dw-light .cm-qualifier {
    color: #6366f1;
  }

  /* Dark Theme tweaks */
  .cm-s-material-darker.CodeMirror {
    background: var(--panel);
  }
  .cm-s-material-darker .CodeMirror-gutters {
    background: var(--panel-header);
    border-right: 1px solid var(--border);
  }
  .cm-s-material-darker span.cm-meta { color: #818cf8; }
  .cm-s-material-darker span.cm-keyword { color: #c084fc; font-weight: 600; }
  .cm-s-material-darker span.cm-builtin { color: var(--accent); font-weight: 500; }
  .cm-s-material-darker span.cm-def { color: #fb923c; font-weight: 600; }
  .cm-s-material-darker span.cm-variable-2 { color: #fbbf24; font-weight: 500; }
  .cm-s-material-darker span.cm-qualifier { color: #818cf8; }

  /* Vars Section Form & JSON */
  .seg {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    background: var(--panel-sub);
  }
  .seg-btn {
    background: transparent;
    color: var(--text-muted);
    border: 0;
    font-family: inherit;
    font-size: 11px;
    font-weight: 500;
    padding: 3px 10px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .seg-btn.active {
    background: var(--accent);
    color: #042f2c;
    font-weight: 700;
  }
  .vars-form {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 10px 12px;
  }
  .vars-json {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }
  .var-row {
    display: flex;
    gap: 6px;
    margin-bottom: 7px;
    align-items: center;
  }
  .var-row input {
    min-width: 0;
    background: var(--panel-sub);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 12px;
    padding: 5px 8px;
    outline: none;
    transition: border-color 0.15s ease;
  }
  .var-row input.k { flex: 0 0 35%; }
  .var-row input.v { flex: 1; }
  .var-row input:focus { border-color: var(--accent); }
  .var-row .x {
    flex: 0 0 auto;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    border-radius: 6px;
    cursor: pointer;
    padding: 3px 8px;
    font-size: 14px;
    line-height: 1;
    transition: all 0.15s ease;
  }
  .var-row .x:hover {
    color: var(--err);
    border-color: var(--err);
    background: var(--err-bg);
  }
  .add-btn {
    width: 100%;
    background: var(--panel-sub);
    border: 1px dashed var(--border);
    color: var(--text-muted);
    border-radius: 6px;
    cursor: pointer;
    padding: 6px 10px;
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 500;
    transition: all 0.15s ease;
  }
  .add-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-subtle);
  }

  /* Error Box */
  .errbox {
    position: absolute;
    inset: 0;
    overflow: auto;
    display: none;
    background: var(--panel);
    padding: 14px 16px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--err);
    white-space: pre-wrap;
    word-break: break-word;
    overflow-wrap: anywhere;
    z-index: 5;
  }
  .errbox.show { display: block; }
  .errbox .err-title {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-size: 10px;
    color: var(--err);
    background: var(--err-bg);
    border: 1px solid var(--err);
    padding: 2px 7px;
    border-radius: 4px;
    margin-bottom: 10px;
    font-family: system-ui, sans-serif;
    font-weight: 700;
  }

  /* Toast Notification */
  .toast {
    position: fixed;
    bottom: 38px;
    right: 24px;
    background: var(--panel-header);
    color: var(--text);
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 12.5px;
    font-weight: 500;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 100;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
    transform: translateY(0);
  }

  /* Footer */
  footer {
    flex: none;
    padding: 6px 18px;
    border-top: 1px solid var(--border);
    background: var(--panel-header);
    color: var(--text-faint);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 11px;
    display: flex;
    align-items: center;
    gap: 16px;
    height: 32px;
    overflow: hidden;
  }
  .footer-github-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 10px;
    font-size: 11px;
    font-weight: 600;
    font-family: system-ui, -apple-system, sans-serif;
    color: var(--text);
    background: var(--btn-bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    text-decoration: none;
    transition: all 0.15s ease;
  }
  .footer-github-btn:hover {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--accent-subtle);
    transform: translateY(-1px);
  }
  .footer-github-btn svg {
    width: 13px;
    height: 13px;
    fill: currentColor;
  }

  /* ========================================================= */
  /* VERTICAL SCREEN / PORTRAIT MODE ADAPTATION                */
  /* ========================================================= */
  main.is-vertical {
    flex-direction: column !important;
    overflow: hidden !important;
  }
  main.is-vertical .pane {
    width: 100% !important;
    min-width: 100% !important;
    max-width: 100% !important;
    flex-direction: column !important;
    flex: 1 1 0% !important;
    min-height: 140px !important;
    height: auto !important;
    transition: flex 0.2s ease, min-height 0.2s ease, height 0.2s ease;
  }
  main.is-vertical .resizer,
  main.is-vertical .resizer-sub {
    display: none !important;
  }

  /* Pane collapse/expand chevron toggle */
  .btn-pane-toggle {
    display: none;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    padding: 0;
    margin-right: 2px;
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .btn-pane-toggle:hover {
    color: var(--text);
    background: var(--btn-hover);
  }
  .chevron-icon {
    width: 15px;
    height: 15px;
    fill: currentColor;
    transition: transform 0.2s ease;
  }
  main.is-vertical .btn-pane-toggle {
    display: inline-flex;
  }

  /* Collapsed state for accordion in vertical mode */
  main.is-vertical .pane.collapsed {
    flex: 0 0 38px !important;
    height: 38px !important;
    min-height: 38px !important;
    max-height: 38px !important;
    overflow: hidden !important;
  }
  main.is-vertical .pane.collapsed .pane-body,
  main.is-vertical .pane.collapsed #subpane-vars,
  main.is-vertical .pane.collapsed .resizer-sub {
    display: none !important;
  }
  main.is-vertical .pane.collapsed .chevron-icon {
    transform: rotate(-90deg);
  }
  main.is-vertical .pane-head {
    cursor: pointer;
  }
  main.is-vertical .pane-head button,
  main.is-vertical .pane-head select,
  main.is-vertical .pane-head input,
  main.is-vertical .pane-head .seg {
    cursor: default;
  }

  @media (max-width: 680px) {
    header { padding: 6px 10px; }
    .brand { gap: 8px; }
    .brand-text {
      flex-direction: column;
      align-items: flex-start;
      gap: 1px;
    }
    .brand-title {
      font-size: 13px;
      line-height: 1.1;
    }
    .brand-badge {
      font-size: 8.5px;
      padding: 0 5px;
      line-height: 1.2;
    }
    footer { font-size: 10px; gap: 8px; padding: 6px 12px; }
    #engine { display: none; }
    .pane-head { padding: 6px 8px; gap: 6px; }
    .pane-head .label { font-size: 11.5px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .pill.running .dot { animation: none; }
    * { transition: none !important; }
  }

  /* Autocomplete Popup (CodeMirror Show-Hint) */
  .CodeMirror-hints {
    position: absolute;
    z-index: 9999;
    list-style: none;
    margin: 0;
    padding: 6px;
    background: var(--panel) !important;
    border: 1px solid var(--border-hover) !important;
    border-radius: 8px !important;
    box-shadow: 0 14px 36px -4px rgba(0, 0, 0, 0.5), 0 6px 14px -2px rgba(0, 0, 0, 0.3) !important;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
    font-size: 12px !important;
    min-width: 290px;
    max-width: 520px;
    max-height: 240px;
    overflow-y: auto;
    box-sizing: border-box;
    backdrop-filter: blur(12px);
  }

  .CodeMirror-hint {
    margin: 1px 0;
    padding: 4px 8px !important;
    border-radius: 5px !important;
    white-space: pre;
    color: var(--text) !important;
    cursor: pointer;
    display: flex !important;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    transition: background-color 0.1s ease, color 0.1s ease;
  }

  li.CodeMirror-hint-active {
    background: var(--btn-hover) !important;
    color: var(--accent) !important;
    outline: 1px solid var(--accent-glow) !important;
  }

  .dw-hint-left {
    display: flex;
    align-items: center;
    gap: 7px;
    min-width: 0;
    flex: 1 1 auto;
  }

  .dw-hint-badge {
    display: inline-block;
    font-size: 9.5px;
    font-weight: 700;
    text-transform: uppercase;
    padding: 1px 4.5px;
    border-radius: 3px;
    letter-spacing: 0.5px;
    flex-shrink: 0;
  }

  .dw-badge-fn    { color: #2dd4bf; background: rgba(45, 212, 191, 0.16); }
  .dw-badge-kw    { color: #a78bfa; background: rgba(167, 139, 250, 0.16); }
  .dw-badge-var   { color: #fbbf24; background: rgba(251, 191, 36, 0.16); }
  .dw-badge-field { color: #38bdf8; background: rgba(56, 189, 248, 0.16); }
  .dw-badge-mime  { color: #f472b6; background: rgba(244, 114, 182, 0.16); }
  .dw-badge-mod   { color: #60a5fa; background: rgba(96, 165, 250, 0.16); }
  .dw-badge-snip  { color: #34d399; background: rgba(52, 211, 153, 0.16); }
  .dw-badge-type  { color: #fb923c; background: rgba(251, 146, 60, 0.16); }

  .dw-hint-name {
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .dw-hint-mod-tag {
    font-size: 10px;
    color: var(--text-faint);
    background: var(--btn-bg);
    border: 1px solid var(--border);
    padding: 0 4px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  .dw-hint-doc {
    font-size: 11px;
    color: var(--text-muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex-shrink: 0;
    max-width: 220px;
    text-align: right;
  }

  li.CodeMirror-hint-active .dw-hint-doc {
    color: var(--text);
  }

  /* Pop-up Documentation Flyout & Hover Tooltip */
  .dw-doc-flyout,
  .dw-hover-tooltip {
    position: fixed;
    z-index: 100000;
    width: 380px;
    max-width: calc(100vw - 32px);
    max-height: 480px;
    background: var(--panel, #0e1520);
    border: 1px solid var(--border-hover, #334155);
    border-radius: 8px;
    box-shadow: 0 16px 40px -4px rgba(0, 0, 0, 0.6), 0 4px 12px -2px rgba(0, 0, 0, 0.35);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text, #e2e8f0);
    padding: 0;
    display: none;
    overflow: hidden;
    backdrop-filter: blur(14px);
    box-sizing: border-box;
    animation: dwDocFadeIn 0.12s ease-out;
  }

  @keyframes dwDocFadeIn {
    from { opacity: 0; transform: translateY(2px) scale(0.985); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .dw-doc-body {
    padding: 12px 14px;
    max-height: 480px;
    overflow-y: auto;
    box-sizing: border-box;
  }

  .dw-doc-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border, #1e293b);
  }

  .dw-doc-title-row {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    flex: 1 1 auto;
  }

  .dw-doc-name {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 14px;
    font-weight: 700;
    color: var(--accent, #2dd4bf);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .dw-doc-badge {
    display: inline-block;
    font-size: 9.5px;
    font-weight: 700;
    text-transform: uppercase;
    padding: 1px 5px;
    border-radius: 3px;
    letter-spacing: 0.5px;
    flex-shrink: 0;
  }

  .dw-doc-mod {
    font-size: 11px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    color: var(--text-faint, #64748b);
    background: var(--btn-bg, #172234);
    border: 1px solid var(--border, #1e293b);
    padding: 1px 6px;
    border-radius: 4px;
    flex-shrink: 0;
  }

  .dw-doc-sig-box {
    background: rgba(0, 0, 0, 0.28);
    border: 1px solid var(--border, #1e293b);
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 12px;
    line-height: 1.45;
    color: #38bdf8;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-all;
  }

  .dw-doc-desc {
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--text, #e2e8f0);
    margin-bottom: 10px;
  }

  .dw-doc-section {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px dashed var(--border, #1e293b);
  }

  .dw-doc-section-title {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-faint, #64748b);
    margin-bottom: 6px;
  }

  .dw-doc-params {
    width: 100%;
    border-collapse: collapse;
    font-size: 11.5px;
    margin-bottom: 6px;
  }

  .dw-doc-params td {
    padding: 3px 6px 3px 0;
    vertical-align: top;
  }

  .dw-doc-param-name {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-weight: 600;
    color: #fbbf24;
    white-space: nowrap;
  }

  .dw-doc-param-type {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    color: #a78bfa;
    font-size: 11px;
    white-space: nowrap;
  }

  .dw-doc-param-desc {
    color: var(--text-muted, #94a3b8);
    line-height: 1.35;
  }

  .dw-doc-returns {
    font-size: 11.5px;
    color: var(--text-muted, #94a3b8);
    margin-top: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .dw-doc-returns code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    color: #34d399;
    font-size: 11.5px;
  }

  .dw-doc-example {
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid var(--border, #1e293b);
    border-radius: 6px;
    padding: 8px 10px;
    margin: 0;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 11.5px;
    line-height: 1.45;
    color: #e2e8f0;
    overflow-x: auto;
    white-space: pre;
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-logo">&#123;&nbsp;&#125;</div>
    <div class="brand-text">
      <span class="brand-title">DataWeave</span>
      <span class="brand-badge">Playground Pro</span>
    </div>
  </div>

  <div class="header-actions">
    <!-- Latency & Status Pill -->
    <div id="status" class="pill" title="Mule 4 runtime transformation status">
      <span class="dot"></span>
      <span id="status-text">Ready</span>
    </div>

    <!-- Reset Layout Button -->
    <button type="button" id="btn-reset-layout" class="icon-btn" title="Reset panel dimensions (or double-click resizers)">
      <svg viewBox="0 0 24 24"><path d="M10 3H4a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4a1 1 0 0 0-1-1zm10 0h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4a1 1 0 0 0-1-1zM10 13H4a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-6a1 1 0 0 0-1-1zm10 0h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-6a1 1 0 0 0-1-1z"/></svg>
    </button>

    <!-- Theme Toggle (Dark / Light) -->
    <button type="button" id="btn-theme" class="icon-btn" title="Toggle Dark / Light mode">
      <!-- Sun icon for dark mode (click to switch to light) -->
      <svg id="icon-sun" viewBox="0 0 24 24" style="display:none;"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
      <!-- Moon icon for light mode (click to switch to dark) -->
      <svg id="icon-moon" viewBox="0 0 24 24"><path d="M12.3 2a10 10 0 0 0-1.9 19.8 10 10 0 0 0 11.6-11.6A10.02 10.02 0 0 1 12.3 2z"/></svg>
    </button>
  </div>
</header>

<main id="main-container">
  <!-- 1. INPUT PANE (Payload & Vars with internal vertical splitter) -->
  <section class="pane" id="pane-input">
    <!-- Payload sub-pane -->
    <div class="sub-pane" id="subpane-payload">
      <div class="pane-head">
        <button type="button" class="btn-pane-toggle" id="toggle-input" title="Toggle Input Section" aria-label="Toggle Input Section">
          <svg class="chevron-icon" viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
        </button>
        <span class="label">Input &middot; Payload</span>
        <span class="grow"></span>
        <button type="button" id="btn-format-in" class="btn-sm" title="Prettify Payload">Format</button>
        <button type="button" id="btn-clear-in" class="btn-sm" title="Clear Payload">Clear</button>
        <select id="in-mime" aria-label="Input format">
          <option value="application/json">JSON</option>
          <option value="application/xml">XML</option>
          <option value="application/csv">CSV</option>
          <option value="application/yaml">YAML</option>
          <option value="text/plain">Text</option>
        </select>
      </div>
      <div class="pane-body">
        <textarea id="in" class="ed" spellcheck="false"></textarea>
      </div>
    </div>

    <!-- Draggable sub-resizer between Payload and Variables -->
    <div class="resizer-sub" id="resizer-vars" role="separator" aria-orientation="horizontal" tabindex="0" title="Drag to adjust Variables height (Double-click to reset)">
      <div class="resizer-grip-sub"></div>
    </div>

    <!-- Variables sub-pane -->
    <div class="sub-pane" id="subpane-vars">
      <div class="pane-head">
        <span class="label">Variables</span>
        <span class="grow"></span>
        <div class="seg">
          <button type="button" id="mode-form" class="seg-btn active">Form</button>
          <button type="button" id="mode-json" class="seg-btn">JSON</button>
        </div>
      </div>
      <div class="pane-body">
        <div id="vars-form" class="vars-form">
          <div id="vars-rows"></div>
          <button type="button" id="vars-add" class="add-btn">+ Add variable</button>
        </div>
        <div id="vars-json" class="vars-json" style="display:none">
          <textarea id="vars" class="ed" spellcheck="false"></textarea>
        </div>
      </div>
    </div>
  </section>

  <!-- Resizer 1 (Input <-> Script) -->
  <div class="resizer" id="resizer-1" role="separator" aria-orientation="vertical" tabindex="0" title="Drag to adjust size (Double-click to reset)">
    <div class="resizer-grip"></div>
  </div>

  <!-- 2. SCRIPT PANE (DataWeave 2.0) -->
  <section class="pane" id="pane-script">
    <div class="pane-head">
      <button type="button" class="btn-pane-toggle" id="toggle-script" title="Toggle Transformation Section" aria-label="Toggle Transformation Section">
        <svg class="chevron-icon" viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
      </button>
      <span class="label">Transformation &middot; DataWeave 2.0</span>
      <span class="grow"></span>
      <button type="button" id="btn-copy-script" class="btn-sm" title="Copy DataWeave Script">
        <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
        <span>Copy</span>
      </button>
    </div>
    <div class="pane-body">
      <textarea id="script" class="ed" spellcheck="false"></textarea>
    </div>
  </section>

  <!-- Resizer 2 (Script <-> Output) -->
  <div class="resizer" id="resizer-2" role="separator" aria-orientation="vertical" tabindex="0" title="Drag to adjust size (Double-click to reset)">
    <div class="resizer-grip"></div>
  </div>

  <!-- 3. OUTPUT PANE -->
  <section class="pane" id="pane-output">
    <div class="pane-head">
      <button type="button" class="btn-pane-toggle" id="toggle-output" title="Toggle Output Section" aria-label="Toggle Output Section">
        <svg class="chevron-icon" viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
      </button>
      <span class="label">Output</span>
      <span id="output-error-badge" class="badge-error" style="display:none">Runtime Error</span>
      <span class="grow"></span>
      <button type="button" id="btn-format-out" class="btn-sm" title="Prettify Output">Format</button>
      <button type="button" id="btn-copy-out" class="btn-sm" title="Copy Output to Clipboard">
        <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
        <span>Copy</span>
      </button>
      <select id="out-mime" aria-label="Output highlight">
        <option value="application/json">JSON</option>
        <option value="application/xml">XML</option>
        <option value="application/csv">CSV</option>
        <option value="application/yaml">YAML</option>
        <option value="text/plain">Text</option>
      </select>
    </div>
    <div class="pane-body">
      <textarea id="out" class="ed" spellcheck="false" readonly></textarea>
      <div id="errbox" class="errbox">
        <div id="err-text"></div>
      </div>
    </div>
  </section>
</main>

<!-- Quick Toast -->
<div id="toast" class="toast">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="var(--accent)"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
  <span id="toast-text">Copied to clipboard</span>
</div>

<footer>
  <span>POST&nbsp;/api/transform</span>
  <span id="engine" style="margin-left:auto">live &middot; auto-runs as you type</span>
  <a href="https://github.com/mradiii/dw-playground-pro" target="_blank" rel="noopener" class="footer-github-btn" title="GitHub: MrAdiii/dw-playground-pro">
    <svg viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
    <span>MrAdiii</span>
  </a>
</footer>

<script src="editor.js"></script>
<script src="autocomplete.js"></script>
<script>
(function(){
  "use strict";

  // ==========================================
  // 1. THEME MANAGEMENT (Dark / Light)
  // ==========================================
  var rootEl = document.documentElement;

  // ==========================================
  // 4. MULTI-FORMAT DOCUMENT PRETTIFIER
  // ==========================================
  function prettifyXml(xml) {
    var reg = /(>)(<)(\/*)/g;
    var formatted = xml.replace(reg, '$1\r\n$2$3');
    var pad = 0;
    var result = '';
    var lines = formatted.split('\r\n');
    for (var i = 0; i < lines.length; i++) {
      var node = lines[i].trim();
      if (!node) continue;
      var indent = 0;
      if (node.match(/.+<\/\w[^>]*>$/)) {
        indent = 0;
      } else if (node.match(/^<\/\w/)) {
        if (pad !== 0) pad -= 1;
      } else if (node.match(/^<\w[^>]*[^\/]>.*$/)) {
        indent = 1;
      }
      var padding = '  '.repeat(pad);
      result += padding + node + '\n';
      pad += indent;
    }
    return result.trim();
  }

  function prettifyCsv(csv) {
    var lines = csv.split(/\r?\n/).filter(function(l){ return l.trim().length > 0; });
    if (!lines.length) return "";

    function splitLine(line) {
      var cells = [];
      var cur = '';
      var inQuotes = false;
      for (var i = 0; i < line.length; i++) {
        var c = line[i];
        if (c === '"') { inQuotes = !inQuotes; cur += c; }
        else if (c === ',' && !inQuotes) { cells.push(cur.trim()); cur = ''; }
        else { cur += c; }
      }
      cells.push(cur.trim());
      return cells;
    }

    var rows = lines.map(splitLine);
    var colCount = 0;
    rows.forEach(function(r){ colCount = Math.max(colCount, r.length); });

    var colWidths = new Array(colCount).fill(0);
    rows.forEach(function(r){
      r.forEach(function(cell, idx){
        colWidths[idx] = Math.max(colWidths[idx], cell.length);
      });
    });

    return rows.map(function(r){
      return r.map(function(cell, idx){
        if (idx === r.length - 1) return cell;
        var padLen = colWidths[idx] - cell.length;
        return cell + ' '.repeat(padLen);
      }).join(', ');
    }).join('\n');
  }

  function prettifyYaml(yaml) {
    var lines = yaml.split(/\r?\n/);
    var result = [];
    var lastWasBlank = false;

    lines.forEach(function(rawLine) {
      var trimmedRight = rawLine.replace(/\s+$/, '');
      if (!trimmedRight.trim()) {
        if (!lastWasBlank && result.length > 0) {
          result.push('');
          lastWasBlank = true;
        }
        return;
      }
      lastWasBlank = false;

      var leadingSpaces = rawLine.match(/^ */)[0].length;
      var content = trimmedRight.trim();

      if (/^[a-zA-Z0-9_-]+:(?!\/)/.test(content) && !content.startsWith('http')) {
        content = content.replace(/^([a-zA-Z0-9_-]+):(\S)/, '$1: $2');
      }
      if (/^-\S/.test(content)) {
        content = content.replace(/^-(\S)/, '- $1');
      }

      var level = Math.round(leadingSpaces / 2) * 2;
      result.push(' '.repeat(level) + content);
    });

    return result.join('\n');
  }

  function formatDocument(text, mimeType) {
    var trimmed = (text || "").trim();
    if (!trimmed) return "";

    if (mimeType.indexOf("json") >= 0) {
      try {
        var obj = JSON.parse(trimmed);
        return JSON.stringify(obj, null, 2);
      } catch(e) {
        throw new Error("Invalid JSON: " + e.message);
      }
    }

    if (mimeType.indexOf("xml") >= 0) {
      try {
        var parser = new DOMParser();
        var xmlDoc = parser.parseFromString(trimmed, "application/xml");
        var parseError = xmlDoc.getElementsByTagName("parsererror");
        if (parseError.length > 0) {
          throw new Error("Invalid XML syntax");
        }
        return prettifyXml(trimmed);
      } catch(e) {
        throw new Error("Invalid XML: " + e.message);
      }
    }

    if (mimeType.indexOf("csv") >= 0) {
      try {
        return prettifyCsv(trimmed);
      } catch(e) {
        throw new Error("Invalid CSV: " + e.message);
      }
    }

    if (mimeType.indexOf("yaml") >= 0) {
      try {
        return prettifyYaml(trimmed);
      } catch(e) {
        throw new Error("Invalid YAML: " + e.message);
      }
    }

    return trimmed;
  }

  resizerVars.addEventListener("pointerdown", function(e){

    function onPointerMove(moveEvent) {

  // ==========================================

  var DEFAULT_H_PERCENTAGES = [30, 40, 30];
  var DEFAULT_V_PERCENTAGES = [33, 34, 33];

  function isVertical() {
    var w = window.innerWidth;

    return w <= 920 || (h > w && w <= 1200);

  function updateLayoutMode() {
    var vert = isVertical();

  function applyHorizontal(p1, p2, p3, save) {
    var min = 12;
    p1 = Math.max(min, Math.min(p1, 76));
    p2 = Math.max(min, Math.min(p2, 76));
    p3 = Math.max(min, 100 - p1 - p2);

    paneInput.style.flex = "0 0 " + p1 + "%";

    paneOut.style.flex = "1 1 0px";

  }

  function applyVertical(p1, p2, p3, save) {
    var min = 12;
    p1 = Math.max(min, Math.min(p1, 76));

  function restoreLayout() {
    if (isVertical()) {
      try {
        var savedV = JSON.parse(localStorage.getItem("dw_pane_heights"));
        if (Array.isArray(savedV) && savedV.length === 3) {
          applyVertical(savedV[0], savedV[1], savedV[2], false);
          return;
        }
      } catch(e){}
      applyVertical(DEFAULT_V_PERCENTAGES[0], DEFAULT_V_PERCENTAGES[1], DEFAULT_V_PERCENTAGES[2], false);
    } else {
      try {
        var savedH = JSON.parse(localStorage.getItem("dw_pane_widths"));
        if (Array.isArray(savedH) && savedH.length === 3) {
          applyHorizontal(savedH[0], savedH[1], savedH[2], false);
          return;

  function setupResizer(resizerEl, isFirstSplitter) {
    resizerEl.addEventListener("pointerdown", function(e){
      if (isVertical()) return;
      e.preventDefault();

      var vert = isVertical();
      resizerEl.setPointerCapture(e.pointerId);
      resizerEl.classList.add("dragging");
      document.body.classList.add(vert ? "is-resizing-v" : "is-resizing-h");

      var containerRect = mainContainer.getBoundingClientRect();
      var totalDimension = vert ? containerRect.height : containerRect.width;

      var currentIn = vert ? paneInput.getBoundingClientRect().height : paneInput.getBoundingClientRect().width;
      var currentSc = vert ? paneSc.getBoundingClientRect().height : paneSc.getBoundingClientRect().width;
      var currentOut = vert ? paneOut.getBoundingClientRect().height : paneOut.getBoundingClientRect().width;

      function onPointerMove(moveEvent) {
        var delta = vert ? (moveEvent.clientY - e.clientY) : (moveEvent.clientX - e.clientX);

        if (isFirstSplitter) {
          var newIn = currentIn + delta;
          var newSc = currentSc - delta;
          var minPx = vert ? 90 : 130;
          if (newIn < minPx || newSc < minPx) return;

          var p1 = (newIn / totalDimension) * 100;
          var p2 = (newSc / totalDimension) * 100;
          var p3 = (currentOut / totalDimension) * 100;
          if (vert) applyVertical(p1, p2, p3, false);
          else applyHorizontal(p1, p2, p3, false);
        } else {
          var newSc2 = currentSc + delta;
          var newOut2 = currentOut - delta;
          var minPx2 = vert ? 90 : 130;
          if (newSc2 < minPx2 || newOut2 < minPx2) return;

          var p1_ = (currentIn / totalDimension) * 100;
          var p2_ = (newSc2 / totalDimension) * 100;
          var p3_ = (newOut2 / totalDimension) * 100;
          if (vert) applyVertical(p1_, p2_, p3_, false);
          else applyHorizontal(p1_, p2_, p3_, false);
        }
      }

      function onPointerUp(upEvent) {
        resizerEl.releasePointerCapture(upEvent.pointerId);
        resizerEl.classList.remove("dragging");
        document.body.classList.remove("is-resizing-v", "is-resizing-h");
        resizerEl.removeEventListener("pointermove", onPointerMove);
        resizerEl.removeEventListener("pointerup", onPointerUp);

        if (vert) {
          var inH = paneInput.getBoundingClientRect().height;
          var scH = paneSc.getBoundingClientRect().height;
          var outH = paneOut.getBoundingClientRect().height;
          var curTotalH = inH + scH + outH;
          applyVertical((inH / curTotalH) * 100, (scH / curTotalH) * 100, (outH / curTotalH) * 100, true);
        } else {
          var inW = paneInput.getBoundingClientRect().width;
          var scW = paneSc.getBoundingClientRect().width;
          var outW = paneOut.getBoundingClientRect().width;
          var curTotalW = inW + scW + outW;
          applyHorizontal((inW / curTotalW) * 100, (scW / curTotalW) * 100, (outW / curTotalW) * 100, true);
        }
      }

      resizerEl.addEventListener("pointermove", onPointerMove);
      resizerEl.addEventListener("pointerup", onPointerUp);
    });
  }

  }

  function addRow(name, value) {
    var row = document.createElement("div"); row.className = "var-row";
    var k = document.createElement("input"); k.className = "k"; k.placeholder = "variable name"; k.value = name || "";
    var v = document.createElement("input"); v.className = "v"; v.placeholder = "value (JSON or literal)"; v.value = (value == null ? "" : value);
    var x = document.createElement("button"); x.type = "button"; x.className = "x"; x.textContent = "\u00d7"; x.title = "Remove";
    x.addEventListener("click", function(){ row.remove(); schedule(); });
    row.appendChild(k); row.appendChild(v); row.appendChild(x);
    rowsEl.appendChild(row);
  }

  function readRows() {
    return Array.prototype.map.call(rowsEl.querySelectorAll(".var-row"), function(r){
      return { name: r.querySelector(".k").value, value: r.querySelector(".v").value };
    });
  }

  function buildFormFromObject(o) {
    rowsEl.innerHTML = "";
    Object.keys(o || {}).forEach(function(k){ addRow(k, JSON.stringify(o[k])); });
    if (!rowsEl.children.length) addRow("", "");
  }

  function currentVarsObject() {
    if (mode === "form") {
      var o = {};
      readRows().forEach(function(r){
        var name = (r.name || "").trim();
        if (name === "") return;
        o[name] = parseVal(r.value);
      });
      return o;
    }
    var raw = edVars.getValue().trim();
    if (!raw) return {};
    try {
      var v = JSON.parse(raw);
      return (v && typeof v === "object" && !Array.isArray(v)) ? v : {};
    } catch(e) { return {}; }
  }

  function extraInputs() {
    var o = currentVarsObject();
    return Object.keys(o).map(function(k){
      return { name: k, mimeType: "application/json", content: JSON.stringify(o[k]) };
    });
  }

  function switchTo(m) {
    if (m === mode) return;
    if (m === "json") {
      edVars.setValue(JSON.stringify(currentVarsObject(), null, 2));
      formEl.style.display = "none";
      jsonEl.style.display = "block";
      bForm.classList.remove("active");
      bJson.classList.add("active");
      mode = "json";
      edVars.refresh();
    } else {
      buildFormFromObject(currentVarsObject());
      jsonEl.style.display = "none";
      formEl.style.display = "block";
      bJson.classList.remove("active");
      bForm.classList.add("active");
      mode = "form";
    }
    run();
  }

  // ==========================================
  // 8. STATUS & OUTPUT HANDLING
  // ==========================================
  var pill = document.getElementById("status");
  var statusText = document.getElementById("status-text");

  function setStatus(s, latency) {
    pill.className = "pill " + (s || "");
    if (s === "running") {
      statusText.textContent = "Running…";
    } else if (s === "ok") {
      statusText.textContent = latency ? (latency + "ms · OK") : "OK";
    } else if (s === "error") {
      statusText.textContent = latency ? (latency + "ms · Error") : "Error";
    } else {
      statusText.textContent = "Ready";
    }
  }

  var errbox = document.getElementById("errbox");
  var errText = document.getElementById("err-text");
  var outErrBadge = document.getElementById("output-error-badge");

  function showOutput(t) {
    errbox.classList.remove("show");
    if (outErrBadge) outErrBadge.style.display = "none";
    edOut.setMode(modeFor(outMime.value));
    edOut.setValue(t);
  }

  function showError(t) {
    errText.textContent = t;
    errbox.classList.add("show");
    if (outErrBadge) outErrBadge.style.display = "inline-flex";
  }

  // ==========================================
  // 9. SCRIPT DIRECTIVE SYNC (output mime)
  // ==========================================
  function readScriptOutputType() {
    var m = edSc.getValue().match(/^\s*output\s+(\S+)/m);
    return m ? m[1] : null;
  }

  function setScriptOutputType(mime) {
    var src = edSc.getValue();
    var re = /^(\s*output\s+)(\S+)(.*)$/m;
    var next;
    if (re.test(src)) {
      next = src.replace(re, function(_, pre, oldMime, rest){ return pre + mime + rest; });
    } else if (/^%dw\s+[\d.]+/m.test(src)) {
      next = src.replace(/^(%dw\s+[\d.]+.*)$/m, function(m){ return m + "\noutput " + mime; });
    } else {
      next = "%dw 2.0\noutput " + mime + "\n---\n" + src;
    }
    if (next !== src) edSc.setValue(next);
  }

  function syncDropdownFromScript() {
    var t = readScriptOutputType();
    if (t && t !== outMime.value &&
        Array.prototype.some.call(outMime.options, function(o){ return o.value === t; })) {
      outMime.value = t;
      syncFormatButtonVisibility();
    }
  }

  // ==========================================
  // 10. LIVE DEBOUNCED TRANSFORMATION RUNNER
  // ==========================================
  var timer = null, controller = null;

  function schedule() {
    clearTimeout(timer);
    setStatus("running");
    timer = setTimeout(run, 350);
  }

  async function run() {
    clearTimeout(timer);
    if (controller) controller.abort();
    controller = new AbortController();
    setStatus("running");
    syncDropdownFromScript();

    var body = {
      script: edSc.getValue(),
      inputs: [{ name: "payload", mimeType: inMime.value, content: edIn.getValue() }].concat(extraInputs()),
      outputMimeType: outMime.value
    };

    var startTime = performance.now();
    try {
      var res = await fetch("./api/transform", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(body),
        signal: controller.signal
      });
      var latency = Math.round(performance.now() - startTime);
      var text = await res.text();
      if (res.ok) {
        showOutput(text);
        setStatus("ok", latency);
      } else if (res.status === 429) {
        showError("⚠️ Rate limit reached (Spike guard active).\n\n" + text);
        setStatus("error", latency);
      } else {
        showError(text);
        setStatus("error", latency);
      }
    } catch(e) {
      if (e.name === "AbortError") return;
      var latencyErr = Math.round(performance.now() - startTime);
      showError("Could not reach the Mule 4 runtime on :8081.\n\n" + e.message);
      setStatus("error", latencyErr);
    }
  }

  // ==========================================
  // 11. STARTER CONTENT & EVENT WIRING
  // ==========================================
  edIn.setValue('{\n  "message": "hello",\n  "items": [1, 2, 3]\n}');
  edVars.setValue('{\n  "factor": 10\n}');
  buildFormFromObject({ factor: 10 });
  edSc.setValue('%dw 2.0\noutput application/json\n---\n{\n  greeting: payload.message,\n  count: sizeOf(payload.items),\n  scaled: payload.items map ((n) -> n * vars.factor)\n}');

  edIn.onChange(schedule);
  edVars.onChange(schedule);
  edSc.onChange(schedule);
  rowsEl.addEventListener("input", schedule);
  document.getElementById("vars-add").addEventListener("click", function(){ addRow("", ""); });
  bForm.addEventListener("click", function(){ switchTo("form"); });
  bJson.addEventListener("click", function(){ switchTo("json"); });

  inMime.addEventListener("change", function(){
    edIn.setMode(modeFor(inMime.value));
    syncFormatButtonVisibility();
    run();
  });

  outMime.addEventListener("change", function(){
    setScriptOutputType(outMime.value);
    syncFormatButtonVisibility();
    run();
  });

  // Warn on page refresh / reload / tab close so user doesn't lose inputs accidentally
  window.addEventListener("beforeunload", function(e) {
    var msg = "All output, variables, and input will be removed.";
    e.preventDefault();
    e.returnValue = msg;
    return msg;
  });

  function setupCollapsiblePanes() {
    var panes = [
      { id: "pane-input", toggleId: "toggle-input" },
      { id: "pane-script", toggleId: "toggle-script" },
      { id: "pane-output", toggleId: "toggle-output" }
    ];
    panes.forEach(function(item){
      var paneEl = document.getElementById(item.id);
      var toggleBtn = document.getElementById(item.toggleId);
      if (!paneEl || !toggleBtn) return;
      function togglePane(e) {
        if (!isVertical()) return;
        if (e.target.closest("button:not(.btn-pane-toggle), select, input, .seg, a")) return;
        paneEl.classList.toggle("collapsed");
        setTimeout(refreshAllEditors, 50);
      }
      toggleBtn.addEventListener("click", togglePane);
      var head = paneEl.querySelector(".pane-head");
      if (head) head.addEventListener("click", togglePane);
    });
  }

  // Init layout, vars split, format buttons and theme
  applyTheme(currentTheme);
  updateLayoutMode();
  setupCollapsiblePanes();
  syncFormatButtonVisibility();

  setTimeout(function(){
    refreshAllEditors();
    run();
  }, 100);
})();
</script>
</body>
</html>
